name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: codex-provider-doctor-macos-arm64
          - os: ubuntu-24.04
            artifact: codex-provider-doctor-linux-x86_64
          - os: windows-2025
            artifact: codex-provider-doctor-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package and builder
        run: python -m pip install ".[build]"

      - name: Run platform integration tests
        run: python -m unittest discover -s tests -v

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Build one-file executable
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --name codex-provider-doctor
          --paths src
          src/codex_provider_doctor/__main__.py

      - name: Smoke test executable
        run: python scripts/verify_binary.py dist

      - name: Write SHA-256 checksums
        run: python scripts/write_checksums.py dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
